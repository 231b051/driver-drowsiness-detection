<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DrowseGuard — Sign Up</title>
  <link rel="stylesheet" href="/css/auth.css" />
<script src="/js/auth.js"></script>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="auth-wrapper">
    <div class="brand">
      <span class="brand-icon">👁️</span>
      <h1>DrowseGuard</h1>
      <p>Create your account</p>
    </div>

    <div class="card">
      <h2>Get Started</h2>
      <p class="subtitle">Register to protect yourself on the road</p>

      <div id="error-msg" class="error-msg hidden"></div>
      <div id="success-msg" class="success-msg hidden"></div>

      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Ankit Sharma" />
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" />
      </div>

      <div class="input-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" />
      </div>

      <button class="btn-primary" onclick="handleSignup()">Create Account</button>

      <p class="switch-auth">Already have an account? <a href="../index.html">Login</a></p>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
